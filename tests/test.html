<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>tests</title>
<style>
  body { font-family: sans-serif; margin: 16px; }
  #summary { padding: 8px 12px; color: #fff; font-weight: bold; }
  #summary.ok { background: #2e9e4f; }
  #summary.ng { background: #d33; }
  li { color: #b00; margin: 4px 0; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="summary">running...</div>
<ul id="failures"></ul>
<script src="../core/namespace.js"></script>
<script src="../games/othello/js/core/namespace.js"></script>
<script src="test-runner.js"></script>
<script src="../games/othello/js/core/event-bus.js"></script>
<script src="../games/othello/js/core/storage.js"></script>
<script src="../games/othello/js/config/version.js"></script>
<script src="../games/othello/js/config/constants.js"></script>
<script src="../games/othello/js/data/characters.js"></script>
<script src="../games/othello/js/data/rulesets.js"></script>
<script src="../games/othello/js/engine/reversi-engine.js"></script>
<script src="../games/othello/js/engine/reversi-ai.js"></script>
<script src="../games/othello/js/engine/four-engine.js"></script>
<script src="../games/othello/js/engine/four-ai.js"></script>
<script src="../games/othello/js/game/reaction-engine.js"></script>
<script src="../games/othello/js/game/line-picker.js"></script>
<script src="../games/othello/js/game/game-controller.js"></script>
<script src="../games/othello/js/audio/sound-synthesizer.js"></script>
<script src="../games/othello/js/ui/character-manager.js"></script>
<script src="../core/event-bus.js"></script>
<script src="../core/storage.js"></script>
<script src="../core/rng.js"></script>
<script src="../core/characters.js"></script>
<script src="../core/common-lines.js"></script>
<script src="../core/line-picker.js"></script>
<script src="../core/emotion-map.js"></script>
<script src="othello/core.test.js"></script>
<script src="othello/engine.test.js"></script>
<script src="othello/four.test.js"></script>
<script src="othello/ai.test.js"></script>
<script src="othello/reaction.test.js"></script>
<script src="othello/characters.test.js"></script>
<script src="othello/controller.test.js"></script>
<script src="othello/sound.test.js"></script>
<script src="othello/character-dom.test.js" data-browser-only></script>
<script src="core/event-bus.test.js"></script>
<script src="core/storage.test.js"></script>
<script src="core/rng.test.js"></script>
<script src="core/characters.test.js"></script>
<script src="core/common-lines.test.js"></script>
<script src="core/line-picker.test.js"></script>
<script src="core/emotion-map.test.js"></script>
<script>
  Ailand.Test.run().then(function (r) {
    var s = document.getElementById('summary');
    s.className = r.failed === 0 ? 'ok' : 'ng';
    s.textContent = 'passed ' + r.passed + ' / failed ' + r.failed;
    var ul = document.getElementById('failures');
    r.failures.forEach(function (f) {
      var li = document.createElement('li');
      li.textContent = f.name + ': ' + f.message;
      ul.appendChild(li);
    });
  });
</script>
</body>
</html>
