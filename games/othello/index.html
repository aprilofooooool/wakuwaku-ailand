<script src="js/main.js"></script>
<script>
  // Registered after main.js, so its DOMContentLoaded handler (UI.init) has already run.
  function mountHeader() {
    document.body.insertBefore(Ailand.core.UI.header({
      title: 'ぱたぱた！オセロっち',
      soundOn: Ailand.core.Sound.isEnabled(),
      onBack: function () { Ailand.games.othello.BgmLink.stop(); location.href = '../../index.html'; },
      onSound: function () { return Ailand.games.othello.UI.toggleSound(); },
      onSettings: function () { Ailand.games.othello.UI.openSettings(); }
    }), document.body.firstChild);
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', mountHeader); }
  else { mountHeader(); }
  // BGM: starts at once when the browser allows audio, else on the first gesture (core/sound.js wireUnlock).
  // Sound toggles reach BgmLink.sync through Ailand.core.Sound.onChange (main.js).
  Ailand.core.Sound.wireUnlock(function () { Ailand.games.othello.BgmLink.sync(); });
  window.addEventListener('pagehide', function () { Ailand.games.othello.BgmLink.stop(); });
</script>
</body>
</html>
