<!DOCTYPE html>
<html lang="ja" data-base="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>わくわく！あいランド</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/top.css">
</head>
<body class="top-page">
<main class="top">
  <div class="top-bar">
    <button type="button" id="top-sound" class="hdr-btn hdr-sound top-sound" aria-label="おと：ON" aria-pressed="true"><span class="hdr-ico" aria-hidden="true">♪</span><span class="hdr-label" aria-hidden="true">おと</span></button>
  </div>
  <h1 class="logo" aria-label="わくわく！あいランド">
    <span class="row" aria-hidden="true">
      <span class="ch small c0" style="--i:0">わ</span><span class="ch small c1" style="--i:1">く</span><span class="ch small c2" style="--i:2">わ</span><span class="ch small c3" style="--i:3">く</span><span class="ch small c4" style="--i:4">！</span>
    </span>
    <span class="row row-ai" aria-hidden="true">
      <span class="sticker" style="--i:5">
        <svg viewBox="0 0 170 150" focusable="false">
          <path d="M85 142 C24 100 4 66 16 38 C28 10 70 10 85 40 C100 10 142 10 154 38 C166 66 146 100 85 142Z" fill="#3a2f5a" transform="translate(0 6)"/>
          <path d="M85 142 C24 100 4 66 16 38 C28 10 70 10 85 40 C100 10 142 10 154 38 C166 66 146 100 85 142Z" fill="#ff5c9a" stroke="#3a2f5a" stroke-width="4"/>
          <ellipse cx="42" cy="38" rx="12" ry="7" fill="#fff" opacity=".8" transform="rotate(-30 42 38)"/>
        </svg>
        <span class="ch ai-white">あい</span>
      </span>
      <span class="ch mid c2" style="--i:7">ラ</span><span class="ch mid c3" style="--i:8">ン</span><span class="ch mid c1" style="--i:9">ド</span>
    </span>
  </h1>
  <p class="lead">あそびたいゲームを えらんでね</p>
  <ul id="cards" class="cards"></ul>
</main>
<script src="core/namespace.js"></script>
<script src="core/storage.js"></script>
<script src="core/games.js"></script>
<script src="core/sound.js"></script>
<script src="core/bgm.js"></script>
<script src="js/top-bgm.js"></script>
<script>
(function () {
  'use strict';
  var Games = Ailand.core.Games;
  var backend = Ailand.core.Storage._backend;
  var NS = 'http://www.w3.org/2000/svg';
  var OUT = '#3a2f5a';

  function svg(inner) {
    var s = document.createElementNS(NS, 'svg');
    s.setAttribute('viewBox', '0 0 64 64');
    s.setAttribute('aria-hidden', 'true');
    s.setAttribute('focusable', 'false');
    s.innerHTML = inner;
    return s;
  }
  function disc(x, y, r, fill) {
    return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fill + '" stroke="' + OUT + '" stroke-width="2.5"/>';
  }
  function rect(x, y, w, h, fill) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3" fill="' + fill + '" stroke="' + OUT + '" stroke-width="2.5"/>';
  }
  function board(fill) {
    return '<rect x="6" y="6" width="52" height="52" rx="8" fill="' + fill + '" stroke="' + OUT + '" stroke-width="2.5"/>';
  }

  var ART = {
    drop4: board('#3aa0ff') +
      disc(20, 20, 7, '#fff') + disc(32, 20, 7, '#fff') + disc(44, 20, 7, '#fff') +
      disc(20, 32, 7, '#ff5c9a') + disc(32, 32, 7, '#ffc83a') + disc(44, 32, 7, '#fff') +
      disc(20, 44, 7, '#ffc83a') + disc(32, 44, 7, '#ff5c9a') + disc(44, 44, 7, '#ffc83a'),
    othello: board('#36c486') + disc(23, 32, 12, '#3a2f5a') + disc(41, 32, 12, '#fff'),
    whack: '<ellipse cx="32" cy="46" rx="24" ry="10" fill="#8a6a4a" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<ellipse cx="32" cy="44" rx="17" ry="6" fill="#4a3426"/>' +
      '<circle cx="32" cy="30" r="14" fill="#ffc83a" stroke="' + OUT + '" stroke-width="2.5"/>' +
      '<circle cx="27" cy="28" r="2.5" fill="' + OUT + '"/><circle cx="37" cy="28" r="2.5" fill="' + OUT + '"/>' +
      '<path d="M27 35 Q32 39 37 35" fill="none" stroke="' + OUT + '" stroke-width="2.5" stroke-linecap="round"/>',
    fill: rect(8, 8, 20, 20, '#ff5c9a') + rect(28, 8, 20, 20, '#ff5c9a') + rect(28, 28, 20, 20, '#ff5c9a') + rect(8, 28, 20, 20, '#ffe3ef'),
    territory: rect(6, 6, 18, 18, '#3aa0ff') + rect(24, 6, 18, 18, '#3aa0ff') + rect(24, 24, 18, 18, '#3aa0ff') +
      rect(40, 40, 18, 18, '#ff5c9a') + rect(22, 40, 18, 18, '#ff5c9a'),
    blocks: rect(8, 42, 16, 16, '#9a6bff') + rect(24, 42, 16, 16, '#9a6bff') + rect(40, 42, 16, 16, '#36c486') +
      rect(24, 26, 16, 16, '#9a6bff') + rect(40, 26, 16, 16, '#ffc83a'),
    chain: disc(20, 44, 11, '#ff5c9a') + disc(44, 44, 11, '#3aa0ff') + disc(32, 22, 11, '#ffc83a')
  };

  function makeCard(g) {
    var li = document.createElement('li');
    var card = document.createElement(g.ready ? 'a' : 'div');
    card.className = g.ready ? 'card' : 'card card-soon';
    if (g.ready) {
      card.href = g.href;
    } else {
      card.setAttribute('aria-disabled', 'true');
    }
    var art = document.createElement('span');
    art.className = 'card-art';
    art.appendChild(svg(ART[g.id] || ''));
    var name = document.createElement('span');
    name.className = 'card-name';
    name.textContent = g.name;
    card.appendChild(art);
    card.appendChild(name);
    if (!g.ready) {
      var soon = document.createElement('span');
      soon.className = 'card-note';
      soon.textContent = 'じゅんびちゅう';
      card.appendChild(soon);
    } else if (Games.hasSave(g, backend)) {
      var badge = document.createElement('span');
      badge.className = 'card-badge';
      badge.textContent = 'つづきから';
      card.appendChild(badge);
    }
    li.appendChild(card);
    return li;
  }

  var list = document.getElementById('cards');
  Games.LIST.forEach(function (g) { list.appendChild(makeCard(g)); });

  // BGM "ようこそ": starts on the first user gesture when sound and BGM are both ON (shared core settings).
  var Sound = Ailand.core.Sound, Bgm = Ailand.core.Bgm;
  var playing = false;
  var soundBtn = document.getElementById('top-sound');
  function syncBgm() {
    var want = Sound.isEnabled() && Sound.isBgmOn();
    if (want && !playing) { Bgm.start(Ailand.top.BGM_SCORE); playing = true; }
    else if (!want && playing) { Bgm.stop(); playing = false; }
  }
  function paintSound() {
    var on = Sound.isEnabled();
    soundBtn.querySelector('.hdr-ico').textContent = on ? '♪' : '×';
    soundBtn.setAttribute('aria-pressed', String(on));
    soundBtn.setAttribute('aria-label', on ? 'おと：ON' : 'おと：OFF');
  }
  // Starts at once when the browser allows audio, else on the first gesture (core/sound.js wireUnlock).
  Sound.wireUnlock(syncBgm);
  soundBtn.addEventListener('click', function () {
    Sound.setEnabled(!Sound.isEnabled());
    paintSound();
    syncBgm();
  });
  window.addEventListener('pagehide', function () { Bgm.stop(); playing = false; });
  paintSound();
})();
</script>
</body>
</html>
