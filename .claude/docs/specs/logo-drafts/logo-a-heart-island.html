<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴ案A ハートの島</title>
<style>
  :root { --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(#bfe9ff, #fff3fb); font-family: var(--font); }
  .logo { position: relative; width: min(358px, 92vw); text-align: center; padding: 8px 0 0; }
  .waku { display: block; font-size: 34px; font-weight: 900; color: #ff8a3d; letter-spacing: 2px;
          text-shadow: 0 3px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 0 -2px 0 #fff, 0 5px 6px #0002; }
  .row { display: flex; align-items: center; justify-content: center; gap: 2px; }
  .island { position: relative; width: 190px; height: 170px; }
  .island svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ai { position: absolute; left: 0; right: 0; top: 46px; font-size: 76px; font-weight: 900; color: #fff;
        letter-spacing: -2px; text-shadow: 0 4px 0 #d6336c, 3px 0 0 #d6336c, -3px 0 0 #d6336c, 0 -3px 0 #d6336c, 0 8px 10px #0003; }
  .land { font-size: 42px; font-weight: 900; color: #2fb3a6; margin-top: 46px;
          text-shadow: 0 3px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff, 0 -2px 0 #fff, 0 5px 6px #0002; }
  @media (prefers-reduced-motion: no-preference) {
    .island { animation: float 3.2s ease-in-out infinite; }
    .spark { animation: twinkle 1.8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .spark.s2 { animation-delay: .6s; } .spark.s3 { animation-delay: 1.2s; }
  }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
</style>
</head>
<body>
<h1 class="logo" aria-label="わくわく！あいランド">
  <span class="waku">わくわく！</span>
  <span class="row">
    <span class="island" aria-hidden="true">
      <svg viewBox="0 0 190 170">
        <ellipse cx="95" cy="152" rx="88" ry="12" fill="#7fd3ff"/>
        <path d="M95 150 C30 105 8 70 22 42 C36 14 78 18 95 48 C112 18 154 14 168 42 C182 70 160 105 95 150Z" fill="#ff6fa8"/>
        <path d="M95 150 C40 112 20 84 26 62 C60 92 130 92 164 62 C170 84 150 112 95 150Z" fill="#ffd27a"/>
        <path d="M150 34 q8 -22 4 -30 M150 34 q-16 -10 -26 -6 M150 34 q18 -12 28 -6" stroke="#2fb3a6" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path class="spark" d="M20 20 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffe14d"/>
        <path class="spark s2" d="M176 96 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#fff"/>
        <path class="spark s3" d="M10 110 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" fill="#ffe14d"/>
      </svg>
      <span class="ai">あい</span>
    </span>
    <span class="land">ランド</span>
  </span>
</h1>
</body>
</html>
