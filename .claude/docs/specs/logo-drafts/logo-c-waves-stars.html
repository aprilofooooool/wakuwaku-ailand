<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロゴ案C 波と星</title>
<style>
  :root { --font: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: linear-gradient(#2a3b8f, #6b5bd6 55%, #ff9ac8); font-family: var(--font); }
  .logo { position: relative; width: min(358px, 92vw); text-align: center; margin: 0; padding: 24px 0 48px; }
  .waku { display: block; font-size: 32px; font-weight: 900; color: #fff7b0; letter-spacing: 3px; text-shadow: 0 0 10px #fff8; }
  .row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .ai { display: flex; gap: 4px; }
  .ai b { display: flex; align-items: center; justify-content: center; width: 92px; height: 92px; border-radius: 50%;
          font-size: 66px; font-weight: 900; color: #fff; box-shadow: inset 0 -8px 0 #0002, 0 6px 14px #0004; }
  .ai b:nth-child(1) { background: radial-gradient(circle at 35% 30%, #ffb3d4, #ff4f9a); }
  .ai b:nth-child(2) { background: radial-gradient(circle at 35% 30%, #b8fff0, #22c3b0); }
  .land { font-size: 40px; font-weight: 900; color: #fff; text-shadow: 0 3px 0 #ff4f9a, 0 0 12px #fff6; }
  .waves { position: absolute; left: -16px; right: -16px; bottom: 0; height: 52px; }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars i { position: absolute; color: #fff27a; font-style: normal; font-size: 18px; }
  @media (prefers-reduced-motion: no-preference) {
    .ai b { animation: bob 2.4s ease-in-out infinite; } .ai b:nth-child(2) { animation-delay: .3s; }
    .waves path { animation: sway 4s ease-in-out infinite alternate; }
    .stars i { animation: twinkle 2s ease-in-out infinite; }
    .stars i:nth-child(2) { animation-delay: .5s; } .stars i:nth-child(3) { animation-delay: 1s; } .stars i:nth-child(4) { animation-delay: 1.5s; }
  }
  @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  @keyframes sway { to { transform: translateX(-24px); } }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</head>
<body>
<h1 class="logo" aria-label="わくわく！あいランド">
  <span class="stars" aria-hidden="true"><i style="left:4%;top:8%">★</i><i style="right:6%;top:4%">✦</i><i style="left:12%;top:58%">✦</i><i style="right:2%;top:52%">★</i></span>
  <span class="waku">わくわく！</span>
  <span class="row">
    <span class="ai" aria-hidden="true"><b>あ</b><b>い</b></span>
    <span class="land">ランド</span>
  </span>
  <svg class="waves" viewBox="0 0 420 52" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 26 q26 -16 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 V52 H0Z" fill="#7fd3ff" opacity=".7"/>
    <path d="M-20 34 q26 -14 52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 t52 0 V52 H-20Z" fill="#fff" opacity=".85"/>
  </svg>
</h1>
</body>
</html>
