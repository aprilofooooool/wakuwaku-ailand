<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BGM 聞き比べ（試作）</title>
<style>
  :root { --bg: #fffaf0; --fg: #333; --card: #fff; --line: #e5d9c3; --accent: #ff8a3d; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font-family: sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.note { margin: 0 0 16px; font-size: 13px; color: #666; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card.on { border-color: var(--accent); }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card .desc { font-size: 13px; color: #555; margin: 0 0 8px; line-height: 1.5; }
  button { font-size: 15px; padding: 8px 14px; border-radius: 8px; border: 1px solid #ccc; background: #fff; margin: 0 6px 6px 0; cursor: pointer; }
  button.main { background: var(--accent); color: #fff; border-color: var(--accent); }
  #stop { background: #555; color: #fff; }
</style>
</head>
<body>
<h1>BGM 聞き比べ（試作）</h1>
<p class="note">ボタンを押すと鳴ります。「順番に 8 秒ずつ」で、ゲームを選んだときの出だしだけを続けて聞けます。試作なので、音量のバランスは仮です。</p>
<div>
  <button class="main" id="tour">順番に 8 秒ずつ</button>
  <button id="stop">とめる</button>
</div>
<div id="list"></div>

<script>
(function () {
  'use strict';
  // ---- note names -> Hz ----
  var IDX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
  function hz(name) {
    if (!name) { return 0; }
    var m = /^([A-G][#b]?)(\d)$/.exec(name);
    var midi = (Number(m[2]) + 1) * 12 + IDX[m[1]];
    return Math.round(440 * Math.pow(2, (midi - 69) / 12) * 100) / 100;
  }
  function mel(list) { return list.map(function (x) { return [Array.isArray(x[0]) ? x[0].map(hz) : hz(x[0]), x[1]]; }); }

  // ================= scores =================
  // 1) Top: "ようこそファンファーレ" D major march, square "trumpet", kick 1&3, snare 2&4, roll at the end.
  var top = (function () {
    var bars = [ // [bass root, bass fifth, chord (2 notes)]
      ['D3', 'A2', ['F#4', 'A4']], ['G3', 'D3', ['G4', 'B4']], ['A2', 'E3', ['E4', 'C#5']], ['D3', 'A2', ['F#4', 'A4']],
      ['B2', 'F#3', ['F#4', 'B4']], ['G3', 'D3', ['G4', 'B4']], ['A2', 'E3', ['E4', 'C#5']], ['D3', 'A2', ['F#4', 'A4']]
    ];
    var bass = [], chords = [], drums = [];
    bars.forEach(function (b, i) {
      bass.push([b[0], 1], [0, 1], [b[1], 1], [0, 1]);
      chords.push([0, 1], [b[2], 1], [0, 1], [b[2], 1]);
      if (i < 7) { drums.push(['k', 1], ['s', 1], ['k', 1], ['s', 1]); }
      else { drums.push(['k', 1], ['s', 1], ['k', 1], ['s', 0.25], ['s', 0.25], ['s', 0.25], ['s', 0.25]); }
    });
    return {
      title: 'トップ「ようこそファンファーレ」', bpm: 112,
      desc: 'ニ長調・112。ラッパのような四角い音（矩形波）の行進曲。ドン・タン・ドン・タンの太鼓。出だしは「タタタ・ターン」と駆け上がるファンファーレ。',
      wave: 'square', level: 0.45, gate: 0.85, bassWave: 'sine', chordWave: 'triangle', chordLen: 0.18,
      bass: mel(bass), chords: mel(chords), drums: drums,
      steps: mel([
        ['A4', 0.5], ['D5', 0.5], ['F#5', 0.5], ['A5', 1.5], ['F#5', 0.5], ['A5', 0.5],
        ['B5', 1], ['A5', 0.5], ['G5', 0.5], ['F#5', 0.5], ['G5', 0.5], ['B5', 1],
        ['A5', 0.75], ['G5', 0.25], ['F#5', 0.5], ['E5', 0.5], ['C#5', 1], ['E5', 1],
        ['D5', 1], ['A4', 0.5], ['D5', 0.5], ['F#5', 1], [0, 1],
        ['F#5', 0.5], ['F#5', 0.5], ['D5', 0.5], ['F#5', 0.5], ['B5', 1], ['A5', 1],
        ['G5', 0.5], ['A5', 0.5], ['B5', 0.5], ['G5', 0.5], ['D5', 1], ['G5', 1],
        ['E5', 0.5], ['F#5', 0.5], ['G5', 0.5], ['A5', 0.5], ['B5', 0.5], ['C#6', 0.5], ['A5', 1],
        ['D6', 1], ['A5', 0.5], ['F#5', 0.5], ['D5', 1], [0, 1]
      ])
    };
  })();

  // 2) Drop4: "ぽよんぽよんシャッフル" Bb major, swung 8ths, sine melody that "boings" up into each note.
  var drop4 = (function () {
    // per bar: [[root, octave-or-fifth], chord]; bar 7 is split Eb | F
    var bars = [
      ['Bb2', 'Bb3', ['D4', 'F4']], ['G3', 'D3', ['Bb3', 'D4']], ['C3', 'C4', ['Eb4', 'G4']], ['F3', 'C3', ['A3', 'C4']],
      ['Bb2', 'Bb3', ['D4', 'F4']], ['G3', 'D3', ['Bb3', 'D4']], null, ['Bb2', 'Bb3', ['D4', 'F4']]
    ];
    var bass = [], chords = [], drums = [];
    bars.forEach(function (b) {
      if (!b) {
        bass.push(['Eb3', 0.5], [0, 0.5], ['Eb4', 0.5], [0, 0.5], ['F3', 0.5], [0, 0.5], ['F3', 0.5], ['C3', 0.5]);
        chords.push([0, 0.5], [['G3', 'Bb3'], 0.5], [0, 0.5], [['G3', 'Bb3'], 0.5], [0, 0.5], [['A3', 'C4'], 0.5], [0, 0.5], [['A3', 'C4'], 0.5]);
      } else {
        bass.push([b[0], 0.5], [0, 0.5], [b[1], 0.5], [b[0], 0.5], [0, 0.5], [b[0], 0.5], [b[1], 1]);
        chords.push([0, 0.5], [b[2], 0.5], [0, 0.5], [b[2], 0.5], [0, 0.5], [b[2], 0.5], [0, 0.5], [b[2], 0.5]);
      }
      drums.push(['k', 0.5], ['h', 0.5], [0, 0.5], ['h', 0.5], ['k', 0.5], ['h', 0.5], [0, 0.5], ['h', 0.5]);
    });
    return {
      title: 'ぽとん4「ぽよんぽよんシャッフル」', bpm: 100, endBpm: 126,
      desc: '変ロ長調・100（終盤 126）。はねるリズム（スイング）。メロディは丸い音（正弦波）が「ぽよん」と下からすくい上がる。大きく跳ぶ音。',
      wave: 'sine', level: 0.42, gate: 0.7, bend: 0.82, swing: 1 / 6, bassWave: 'triangle', chordWave: 'sine', chordLen: 0.1,
      bass: mel(bass), chords: mel(chords), drums: drums,
      steps: mel([
        ['F5', 0.5], ['D5', 0.5], ['F5', 0.5], ['Bb5', 1], [0, 0.5], ['F5', 0.5], ['G5', 0.5],
        ['Bb5', 0.5], ['G5', 0.5], [0, 0.5], ['D5', 0.5], ['G5', 1], ['F5', 1],
        ['Eb5', 0.5], ['G5', 0.5], ['C6', 1], ['Bb5', 0.5], ['G5', 0.5], ['Eb5', 1],
        ['F5', 0.5], [0, 0.5], ['C5', 0.5], ['F5', 0.5], ['A5', 1], [0, 1],
        ['D6', 0.5], ['Bb5', 0.5], ['F5', 0.5], ['D5', 0.5], ['F5', 0.5], ['Bb5', 0.5], [0, 1],
        ['G5', 0.5], ['A5', 0.5], ['Bb5', 0.5], ['G5', 0.5], ['D5', 1], ['G5', 1],
        ['Eb5', 0.5], ['G5', 0.5], ['Bb5', 1], ['C6', 0.5], ['A5', 0.5], ['F5', 1],
        ['Bb5', 0.5], ['F5', 0.5], ['D5', 0.5], ['F5', 0.5], ['Bb4', 1], [0, 1]
      ])
    };
  })();

  // 3) Othello: "ひなたぼっこワルツ" Eb major 3/4, music-box sine with a soft octave sparkle, no drums.
  var othello = (function () {
    var prog = [
      ['Eb3', ['G3', 'Bb3']], ['Eb3', ['G3', 'Bb3']], ['Ab2', ['Ab3', 'C4']], ['Bb2', ['Ab3', 'D4']],
      ['C3', ['G3', 'Eb4']], ['Ab2', ['Ab3', 'C4']], ['Bb2', ['Ab3', 'D4']], ['Eb3', ['G3', 'Bb3']],
      ['Ab2', ['Ab3', 'C4']], ['Bb2', ['Ab3', 'D4']], ['G3', ['Bb3', 'D4']], ['C3', ['G3', 'Eb4']],
      ['Ab2', ['Ab3', 'C4']], ['Bb2', ['Ab3', 'D4']], ['Eb3', ['G3', 'Bb3']], ['Eb3', ['G3', 'Bb3']]
    ];
    var bass = [], chords = [];
    prog.forEach(function (p) {
      bass.push([p[0], 1], [0, 2]);
      chords.push([0, 1], [p[1], 1], [p[1], 1]);
    });
    return {
      title: 'オセロっち「ひなたぼっこワルツ」', bpm: 144,
      desc: '変ホ長調・3拍子・144（1小節＝約1.25秒）。オルゴールのようなきらっとした音。ズン・チャッ・チャッのワルツ。太鼓なし。',
      wave: 'sine', level: 0.4, gate: 0.8, sparkle: true, bassWave: 'sine', chordWave: 'triangle', chordLen: 0.14,
      bass: mel(bass), chords: mel(chords), drums: null,
      steps: mel([
        ['G5', 1.5], ['F5', 0.5], ['Eb5', 1],
        ['Bb4', 1], ['Eb5', 1], ['G5', 1],
        ['Ab5', 1.5], ['G5', 0.5], ['F5', 1],
        ['D5', 1], ['F5', 1], ['Bb5', 1],
        ['C6', 1.5], ['Bb5', 0.5], ['G5', 1],
        ['Ab5', 1], ['F5', 1], ['C5', 1],
        ['D5', 1], ['Eb5', 0.5], ['F5', 0.5], ['Bb4', 1],
        ['Eb5', 2], [0, 1],
        ['C5', 0.5], ['Eb5', 0.5], ['Ab5', 1], ['C6', 1],
        ['Bb5', 1.5], ['Ab5', 0.5], ['F5', 1],
        ['G5', 0.5], ['Bb5', 0.5], ['D5', 1], ['G5', 1],
        ['Eb5', 1.5], ['D5', 0.5], ['C5', 1],
        ['Ab4', 1], ['C5', 1], ['Eb5', 1],
        ['F5', 1], ['G5', 0.5], ['Ab5', 0.5], ['Bb5', 1],
        ['G5', 1.5], ['F5', 0.5], ['Eb5', 1],
        ['Eb5', 2], ['Bb4', 1]
      ])
    };
  })();

  // 4) Whack: "ドタバタ・ダッシュ" E major, IV-V-iii-vi, sawtooth "pico" lead in 16ths, four-on-the-floor.
  var whack = (function () {
    var prog = [
      ['A2', 'A3', ['C#4', 'E4']], ['B2', 'B3', ['D#4', 'F#4']], ['G#2', 'G#3', ['B3', 'D#4']], ['C#3', 'C#4', ['E4', 'G#4']],
      ['A2', 'A3', ['C#4', 'E4']], ['B2', 'B3', ['D#4', 'F#4']], ['C#3', 'C#4', ['E4', 'G#4']], ['B2', 'B3', ['D#4', 'F#4']]
    ];
    var bass = [], chords = [], drums = [];
    prog.forEach(function (p) {
      for (var k = 0; k < 4; k++) { bass.push([p[0], 0.5], [p[1], 0.5]); }
      chords.push([0, 1.5], [p[2], 0.5], [0, 1.5], [p[2], 0.5]);
      drums.push(['k', 0.5], ['h', 0.5], ['ks', 0.5], ['h', 0.5], ['k', 0.5], ['h', 0.5], ['ks', 0.5], ['h', 0.5]);
    });
    var A = [['E5', 0.25], ['F#5', 0.25], ['G#5', 0.5], ['E5', 0.5], ['C#5', 0.5], ['E5', 0.5], ['A5', 0.5], ['G#5', 0.5], ['E5', 0.5]];
    var B = [['F#5', 0.25], ['G#5', 0.25], ['A5', 0.5], ['F#5', 0.5], ['D#5', 0.5], ['F#5', 0.5], ['B5', 0.5], ['A5', 0.5], ['F#5', 0.5]];
    return {
      title: 'キャラたたき「ドタバタ・ダッシュ」', bpm: 150, endBpm: 180,
      desc: 'ホ長調・150（残り10秒 180）。せわしない細かい音のピコピコ音（のこぎり波）。ドン・ドン・ドン・ドンの4つ打ちとシャカシャカ。J-POP でよくある明るく急ぐコード進行。',
      wave: 'sawtooth', level: 0.22, gate: 0.6, bassWave: 'triangle', chordWave: 'square', chordLen: 0.08,
      bass: mel(bass), chords: mel(chords), drums: drums,
      steps: mel([].concat(A, B, [
        ['G#5', 0.5], ['B5', 0.5], ['G#5', 0.25], ['F#5', 0.25], ['E5', 0.5], ['D#5', 0.5], ['E5', 0.5], ['F#5', 0.5], ['G#5', 0.5],
        ['C#6', 0.5], ['B5', 0.5], ['G#5', 0.5], ['E5', 0.5], ['C#5', 1], [0, 1]
      ], A, B, [
        ['E5', 0.25], ['G#5', 0.25], ['C#6', 0.5], ['B5', 0.5], ['G#5', 0.5], ['A5', 0.5], ['B5', 0.5], ['C#6', 0.5], ['B5', 0.5],
        ['B5', 0.5], [0, 0.25], ['B5', 0.25], ['A5', 0.25], ['G#5', 0.25], ['F#5', 0.5], ['D#5', 0.5], ['F#5', 0.5], ['B4', 0.5], [0, 0.5]
      ]))
    };
  })();

  var SONGS = [top, drop4, othello, whack];

  // ================= tiny engine (trial copy of core/bgm.js + new options) =================
  var ctx = null, master = null, noise = null;
  function ensure() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.25 * 0.5 * 2; master.connect(ctx.destination);
      noise = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
      var d = noise.getChannelData(0);
      for (var i = 0; i < d.length; i++) { d[i] = Math.random() * 2 - 1; }
    }
    if (ctx.state !== 'running') { ctx.resume(); }
  }
  function env(g, t0, peak, dur, a) {
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + Math.min(a, dur / 2));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  }
  function tone(t0, f, dur, type, peak, bend, a) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    if (bend) { o.frequency.setValueAtTime(f * bend, t0); o.frequency.exponentialRampToValueAtTime(f, t0 + Math.min(0.06, dur * 0.5)); }
    else { o.frequency.setValueAtTime(f, t0); }
    env(g, t0, peak, dur, a || 0.012);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
    live.push(o);
  }
  function drum(t0, kind) {
    if (kind === 'k' || kind === 'ks') {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(150, t0); o.frequency.exponentialRampToValueAtTime(50, t0 + 0.12);
      env(g, t0, 0.55, 0.14, 0.003); o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + 0.16); live.push(o);
    }
    if (kind === 'h' || kind === 's' || kind === 'ks') {
      var src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g2 = ctx.createGain();
      src.buffer = noise;
      var hat = kind === 'h';
      f.type = hat ? 'highpass' : 'bandpass'; f.frequency.value = hat ? 7000 : 1800;
      var dur = hat ? 0.04 : 0.12;
      env(g2, t0, hat ? 0.18 : 0.32, dur, 0.002);
      src.connect(f); f.connect(g2); g2.connect(master); src.start(t0); src.stop(t0 + dur + 0.02); live.push(src);
    }
  }
  function events(list, isDrum) {
    var out = [], off = 0;
    (list || []).forEach(function (x) { if (x[0]) { out.push({ beat: off, v: x[0], len: x[1] }); } off += x[1]; });
    return { list: out, total: off };
  }
  function swungBeat(b, swing) {
    if (!swing) { return b; }
    var f = b - Math.floor(b);
    return Math.abs(f - 0.5) < 1e-9 ? b + swing : b;
  }

  var song = null, bpm = 120, startTime = 0, timer = null, live = [], cursor = 0, voices = [], tourTimer = null;
  function play(s, fast) {
    stop(true);
    ensure();
    song = s; bpm = fast && s.endBpm ? s.endBpm : s.bpm;
    voices = [
      { e: events(s.steps), kind: 'mel' }, { e: events(s.bass), kind: 'bass' },
      { e: events(s.chords), kind: 'chord' }, { e: events(s.drums), kind: 'drum' }
    ];
    startTime = ctx.currentTime + 0.1; cursor = 0;
    mark();
    tick();
  }
  function tick() {
    if (!song) { return; }
    var spb = 60 / bpm;
    var horizonBeat = (ctx.currentTime + 0.15 - startTime) / spb;
    voices.forEach(function (v) {
      var total = v.e.total; if (!total) { return; }
      var k0 = Math.floor(cursor / total), k1 = Math.floor(horizonBeat / total);
      for (var k = k0; k <= k1; k++) {
        v.e.list.forEach(function (n) {
          var b = k * total + n.beat;
          if (b < cursor || b >= horizonBeat) { return; }
          var t0 = startTime + swungBeat(b, song.swing) * spb;
          var len = n.len * spb;
          if (v.kind === 'drum') { drum(t0, n.v); return; }
          var fs = Array.isArray(n.v) ? n.v : [n.v];
          fs.forEach(function (f) {
            if (v.kind === 'mel') {
              tone(t0, f, len * (song.gate || 0.92), song.wave, 0.32 * (song.level || 1) / 0.4, song.bend, 0.015);
              if (song.sparkle) { tone(t0, f * 2, Math.min(len, 0.5), 'sine', 0.06, 0, 0.004); }
            } else if (v.kind === 'bass') {
              tone(t0, f, len * 0.85, song.bassWave || 'sine', 0.34, 0, 0.02);
            } else {
              tone(t0, f, Math.min(len * 0.6, song.chordLen || 0.12), song.chordWave || 'sine', 0.08, 0, 0.008);
            }
          });
        });
      }
    });
    cursor = horizonBeat;
    live = live.slice(-400);
    timer = setTimeout(tick, 25);
  }
  function stop(keepTour) {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!keepTour && tourTimer) { clearTimeout(tourTimer); tourTimer = null; }
    if (ctx) { live.forEach(function (o) { try { o.stop(ctx.currentTime + 0.02); } catch (e) {} }); }
    live = []; song = null; mark();
  }

  // ================= UI =================
  var list = document.getElementById('list');
  SONGS.forEach(function (s, i) {
    var c = document.createElement('div'); c.className = 'card'; c.id = 'card' + i;
    c.innerHTML = '<h2></h2><p class="desc"></p>';
    c.querySelector('h2').textContent = s.title;
    c.querySelector('.desc').textContent = s.desc;
    var b = document.createElement('button'); b.className = 'main'; b.textContent = 'きく（' + s.bpm + '）';
    b.onclick = function () { play(s, false); };
    c.appendChild(b);
    if (s.endBpm) {
      var f = document.createElement('button'); f.textContent = '速いテンポ（' + s.endBpm + '）';
      f.onclick = function () { play(s, true); };
      c.appendChild(f);
    }
    list.appendChild(c);
  });
  function mark() { SONGS.forEach(function (s, i) { document.getElementById('card' + i).classList.toggle('on', s === song); }); }
  document.getElementById('stop').onclick = function () { stop(false); };
  document.getElementById('tour').onclick = function () {
    var i = 0;
    (function next() {
      if (i >= SONGS.length) { stop(false); return; }
      play(SONGS[i++], false);
      tourTimer = setTimeout(next, 8000);
    })();
  };
})();
</script>
</body>
</html>
